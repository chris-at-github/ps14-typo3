        fields:
          header: 'Variante: Text und verschachtelte Inhalte, erstes Item initial offen'
          header_layout: 2
          tx_foundation_elements_header: auto
          bodytext: >-
            <p>Akkordeon mit zwei Text-Items und einem Item mit
            verschachtelten Inhaltselementen. Nur das erste Item ist beim
            Laden geöffnet.</p>
        items_field: ps14_accordion_items
        items:
          - record_type: text
            title: Reinigung im Trockenverfahren
            active: 1
            description: >-
              <p>Bauteile werden ohne Flüssigkeiten gereinigt. Eine
              integrierte Ionisierung neutralisiert die elektrostatischen
              Bindungskräfte zwischen Staub und Oberfläche.</p><ul><li>keine
              Trocknungszeit</li><li>sauberer Arbeitsplatz</li><li>geringer
              Energiebedarf</li></ul>
          - record_type: text
            title: Einsatzgebiete
            active: 0
            description: >-
              <p>Die Anlagen eignen sich für Kunststoff-, Metall- und
              Glasbauteile vor dem Lackieren, Bedrucken oder Verkleben.</p>
          - record_type: content
            title: Funktionsprinzip
            active: 0
            content:
              - CType: text
                header: Ionisierung und Absaugung
                bodytext: >-
                  <p>Druckluft löst die Partikel von der Oberfläche,
                  ionisierte Luft verhindert die erneute Anhaftung. Die
                  Absaugung führt den Staub direkt ab.</p>

