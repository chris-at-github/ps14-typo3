# Beispielseiten der Content Blocks (KIST, Schritt 2.1, Task 8)
#
# Zweck: Nach jedem `ddev pull prod-v12` die Beispielseiten unter „Modules“
# [11] per MCP (`in2mcp`) neu anlegen. Nach dem Go-Live werden die Seiten
# einmal in der Produktion angelegt; danach kommen sie mit jedem Pull mit und
# diese Datei dient nur noch als Vorlage.
#
# Ablauf für Claude (nur MCP, kein SQL):
# 1. Prüfen, ob die Seiten schon existieren (`search_pages` nach Slug).
# 2. Seiten unter `parent` anlegen (`create_page`, Felder aus `page`);
#    existiert eine Seite (`existing: true`), nur die Elemente ergänzen.
# 3. Elemente in der angegebenen Reihenfolge anlegen
#    (`create_content_element`), `defaults` immer mitgeben: MCP übernimmt
#    die TSconfig-Vorgaben für `frame_class`/`tx_foundation_variant` nicht
#    (Optimierung P11).
# 4. Items per `add_child_record` (Feld `items_field`), verschachtelte
#    Inhaltselemente per `add_child_record` am Item (Feld `content`) mit
#    `colPos: 5628` — die Vorgabe aus `overrideChildTca` greift nur im
#    Backend-Formular.
# 5. Dateien per `search_files` (Pfad) suchen und mit `add_file_reference`
#    an das Feld hängen. Ein Feld nimmt einen Pfad, eine Liste oder
#    `{path, fields}` (Felder der Dateireferenz, z. B. Video-Optionen).
#    `flexform` (Sheet => Feld => Wert) als `pi_flexform`-XML schreiben.
# 6. `ddev typo3 cache:flush`, jede Seite unter `/de/<slug>` auf HTTP 200
#    und erwartetes Markup prüfen, neue UIDs im Plan
#    `docs/plans/kist-content-blocks.md` (Status Task 8) nachtragen.

parent: 11

defaults:
  page:
    hidden: 0
    no_index: 1
    no_search: 1
  content:
    frame_class: '0'
    tx_foundation_variant: default
  nested:
    colPos: 5628
    frame_class: '0'
    tx_foundation_variant: default
    header_layout: 100

pages:
  - title: Akkordeon
    slug: /modules/akkordeon
    existing: true
    content:
