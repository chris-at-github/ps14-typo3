# Pulls the database and fileadmin from the TYPO3 v12 production server: `ddev pull prod-v12`
# (`ddev pull prod` is reserved for the TYPO3 v14 production)
#
# Requirements: `ddev auth ssh` (SSH key for the server in the agent).
# Options: `ddev pull prod-v12 --skip-files`, `ddev pull prod-v12 --skip-db`, `-y` (no confirmation).
#
# Database: dumped on the server by prod-db-dump.php (credentials from .env, otherwise additional.php),
# imported by DDEV into the local database (replaces it completely).
# Files: rsync of fileadmin into public/fileadmin (with --delete, local files not on the server are removed).
#
# PROD_ROOT: project root on the server (TYPO3 v12: classic mode, fileadmin in the root).
# For the TYPO3 v14 production copy this file to prod.yaml with e.g.
# PROD_ROOT=/usr/home/kistae/public_html/production-v14/current and PROD_FILEADMIN=public/fileadmin.
environment_variables:
  PROD_SSH: kistae@kist-escherich.com
  PROD_SSH_PORT: "222"
  PROD_ROOT: /usr/home/kistae/public_html/production
  PROD_FILEADMIN: fileadmin
  # Regenerated by TYPO3, not transferred (space separated)
  PROD_FILES_EXCLUDE: "_processed_ _temp_"

auth_command:
  command: |
    set -eu -o pipefail
    ssh-add -l >/dev/null || ( echo "Please run 'ddev auth ssh' before running this command." && exit 1 )

db_pull_command:
  command: |
    set -eu -o pipefail
    mkdir -p /var/www/html/.ddev/.downloads
    # The dump script is copied into a temporary file on the server and removed afterwards
    ssh -p "${PROD_SSH_PORT}" -o BatchMode=yes "${PROD_SSH}" \
      "f=\$(mktemp /tmp/ddev-pull-XXXXXX.php) && trap 'rm -f \$f' EXIT && cat > \$f && php \$f '${PROD_ROOT}'" \
      < /var/www/html/.ddev/providers/prod-db-dump.php \
      > /var/www/html/.ddev/.downloads/db.sql.gz
  service: web

files_pull_command:
  command: |
    set -eu -o pipefail
    excludes=()
    for exclude in ${PROD_FILES_EXCLUDE}; do excludes+=("--exclude=/${exclude}/"); done
    mkdir -p /var/www/html/public/fileadmin
    rsync -az --delete --info=stats1 "${excludes[@]}" \
      -e "ssh -p ${PROD_SSH_PORT} -o BatchMode=yes" \
      "${PROD_SSH}:${PROD_ROOT}/${PROD_FILEADMIN}/" /var/www/html/public/fileadmin/
  service: web

# The files are synchronised directly into public/fileadmin by files_pull_command
files_import_command:
  command: |
    echo "fileadmin synchronised to public/fileadmin"
  service: web
