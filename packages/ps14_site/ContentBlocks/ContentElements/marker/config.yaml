name: ps14/marker
typeName: ps14_marker
vendorPrefix: tx_site
group: default
basics:
  - Ps14/Appearance
fields:
  - identifier: Ps14/Header
    type: Basic
  - identifier: bodytext
    useExistingField: true
    enableRichtext: true
    richtextConfiguration: ps14Default
  - identifier: image
    useExistingField: true
    maxitems: 1
  - identifier: items
    type: Collection
    foreign_table: tx_site_marker_item
    minitems: 1
    appearance:
      collapseAll: true
      levelLinksPosition: bottom
      showAllLocalizationLink: true
      showSynchronizationLink: true
      showPossibleLocalizationRecords: true
