<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:fo="http://typo3.org/ns/Ps14/Foundation/ViewHelpers" data-namespace-typo3-fluid="true">
    <f:section name="Controls">
        <f:if condition="{icons}">
            <f:else><f:variable name="icons" value="{prev: 'EXT:ps14_site/Resources/Private/Assets/Svg/Embed/arrow-left.svg', next: 'EXT:ps14_site/Resources/Private/Assets/Svg/Embed/arrow-right.svg'}" /></f:else>
        </f:if>

        <div class="slider--controls">
            <div class="slider--controls-inner">
                <div class="slider--prev"><button aria-label="{f:translate(key: 'prev', domain: 'ps14_foundation.frontend')}" tabindex="-1"><fo:svg.inline source="{icons.prev}" /></button></div>
                <div class="slider--next"><button aria-label="{f:translate(key: 'next', domain: 'ps14_foundation.frontend')}" tabindex="-1"><fo:svg.inline source="{icons.next}" /></button></div>
            </div>
        </div>
    </f:section>

    <f:section name="Navigation">
        <div class="slider--navigation">
            <div class="slider--navigation-inner">
                <ul>
                    <f:for each="{elements}" as="item" iteration="iterator">
                        <li title="{iterator.cycle}{f:if(condition: item.data.title, then: ': {item.data.title}')}"><span>{iterator.cycle}<f:if condition="{item.data.title}">: {item.data.title}</f:if></span></li>
                    </f:for>
                </ul>
            </div>
        </div>
    </f:section>
</html>
