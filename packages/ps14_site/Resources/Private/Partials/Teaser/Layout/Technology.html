<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
    <f:section name="Main">
        <f:if condition="{menu -> f:count()} == 1">
            <f:then>
                <f:for each="{menu}" as="page">
                    <div class="teaser teaser--layout-technology">
                        <f:render section="Item" arguments="{page: page, settings: settings}" />
                    </div>
                </f:for>
            </f:then>
            <f:else>
                <ul class="teaser--container">
                    <f:for each="{menu}" as="page">
                        <li class="teaser teaser--layout-technology">
                            <f:render section="Item" arguments="{page: page, settings: settings}" />
                        </li>
                    </f:for>
                </ul>
            </f:else>
        </f:if>
    </f:section>

    <f:section name="Item">
        <f:variable name="mediaLarge" value="{f:if(condition: page.mediaLarge.0, then: page.mediaLarge.0, else: page.media.0)}" />

        <div class="teaser--media">
            <f:if condition="{mediaLarge}">
                <f:render partial="Media/Main" section="Main" arguments="{file: mediaLarge, settings: settings.media.technology}" />
            </f:if>
        </div>

        <div class="teaser--body">
            <header class="teaser--title ce-header ce-header--layout-2">
                <h2>
                    <f:link.typolink parameter="{page.link}">
                        <span class="teaser--title-prefix"><f:translate key="teaser.technology.title-prefix" domain="ps14_site.messages" /></span>
                        <strong class="teaser--title-main">{f:if(condition: page.data.tx_site_teaser_title, then: page.data.tx_site_teaser_title, else: page.data.title)}</strong>
                    </f:link.typolink>
                </h2>
            </header>

            <f:if condition="{page.data.tx_site_teaser_abstract_long}">
                <f:then><f:format.html>{page.data.tx_site_teaser_abstract_long}</f:format.html></f:then>
                <f:else if="{page.data.abstract}"><f:format.html>{page.data.abstract}</f:format.html></f:else>
            </f:if>

            <f:link.typolink class="link--cta teaser--readmore" parameter="{page.link}" additionalAttributes="{'tabindex': '-1'}">
                <f:if condition="{page.data.tx_site_teaser_readmore}">
                    <f:then>{page.data.tx_site_teaser_readmore}</f:then>
                    <f:else><f:translate key="teaser.technology.readmore" domain="ps14_site.messages" /></f:else>
                </f:if>
            </f:link.typolink>
        </div>
    </f:section>
</html>
