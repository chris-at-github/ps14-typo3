<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
    <f:section name="Main">
        <div id="header" class="container-outer page-header">
            <div class="container-inner">
                <f:render partial="Page/Layout/Logo" section="Main" arguments="{_all}" />
                <f:render section="Hamburger" />

                <div id="off-canvas" class="off-canvas">
                    <f:if condition="{site.settings.pages.search}">
                        <f:render partial="Page/Layout/Search" section="Icon" arguments="{_all}" />
                        <f:render partial="Page/Layout/Search" section="Field" arguments="{_all}" />
                    </f:if>

                    <f:render partial="Page/Navigation/Language" section="Main" arguments="{_all}" />

                    <f:if condition="{site.settings.navigation.main}">
                        <f:render partial="Page/Navigation/Main" section="Main" arguments="{_all}" />
                    </f:if>

                    <f:if condition="{site.settings.navigation.meta}">
                        <f:render partial="Page/Navigation/Meta" section="Main" arguments="{_all}" />
                    </f:if>
                </div>
            </div>
        </div>

        <f:render partial="Page/Navigation/Breadcrumb" section="Main" arguments="{_all}" />
    </f:section>

    <f:section name="Hamburger">
        <button class="hamburger hamburger--layout-0" type="button" aria-label="{f:translate(key: 'offcanvas.toggle', domain: 'ps14_foundation.frontend')}" aria-controls="off-canvas">
            <span class="hamburger-box">
                <span class="hamburger-inner"></span>
            </span>
        </button>
    </f:section>
</html>
