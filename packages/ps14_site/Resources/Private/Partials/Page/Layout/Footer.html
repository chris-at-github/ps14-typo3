<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
    <f:section name="Main">
        <f:if condition="{data.tx_site_disable_sticky} == 0">
            <f:render partial="Page/Layout/Sticky" section="Container" arguments="{_all}" />
        </f:if>

        <div id="footer" class="page-footer">
            <div class="container-outer page-footer--content">
                <div class="container-inner">
                    <f:render partial="Page/Layout/Logo" section="Main" arguments="{_all}" />

                    <div class="row">
                        <div class="col-12 col-lg-4">
                            <f:comment>Adresse aus tt_address (provider), folgt mit tt_address in Schritt 2</f:comment>
                            <f:render partial="Page/Layout/Address" section="Main" arguments="{_all}" optional="true" />
                        </div>

                        <div class="col-12 col-sm-6 col-lg-4">
                            <f:cObject typoscriptObjectPath="block.contentFooterMiddle" />
                        </div>

                        <div class="col-12 col-sm-6 col-lg-4">
                            <f:cObject typoscriptObjectPath="block.contentFooterRight" />
                        </div>
                    </div>

                    <f:render section="Logos" arguments="{_all}" />
                </div>
            </div>

            <div class="container-outer page-footer--navigation">
                <div class="container-inner">
                    <f:if condition="{site.settings.navigation.footer}">
                        <f:render partial="Page/Navigation/Footer" section="Main" arguments="{_all}" />
                    </f:if>
                </div>
            </div>
        </div>
    </f:section>

    <f:section name="Logos">
        <div class="page-footer--logos">
            <ul class="footer--logo-group">
                <f:for each="{footerLogos}" as="logo">
                    <li class="footer--logo-group__item">
                        <f:link.typolink parameter="{logo.data.header_link}" class="footer--logo">
                            <f:if condition="{logo.images.0}">
                                <div class="footer--logo__image">
                                    <f:image image="{logo.images.0}" maxWidth="300" loading="lazy" cropVariant="default" />
                                </div>
                            </f:if>
                            <div class="footer--logo__body">
                                <f:if condition="{logo.data.bodytext}">
                                    <div class="footer--logo__description"><f:format.html>{logo.data.bodytext}</f:format.html></div>
                                </f:if>
                            </div>
                        </f:link.typolink>
                    </li>
                </f:for>
            </ul>
        </div>
    </f:section>
</html>
