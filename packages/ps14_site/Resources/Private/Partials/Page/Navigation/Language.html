<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:co="http://typo3.org/ns/Ps14/Component/Components/ComponentCollection"
    data-namespace-typo3-fluid="true">
    <f:section name="Main">
        <f:if condition="{navigationLanguage}">
            <co:navigation title="{f:translate(key: 'page-header.language-navigation', domain: 'ps14_site.messages')}" class="page-header__language">
                <co:navigation.list class="page-header__language-list">
                    <f:for each="{navigationLanguage}" as="language">
                        <f:if condition="{language.available}">
                            <li class="navigation__item">
                                <a class="navigation-item page-header__language-link" href="{language.link}" hreflang="{language.hreflang}" lang="{language.hreflang}" title="{language.navigationTitle}" aria-current="{f:if(condition: language.active, then: 'true')}">
                                    <span class="navigation-item__title">{language.twoLetterIsoCode}</span>
                                </a>
                            </li>
                        </f:if>
                    </f:for>
                </co:navigation.list>
            </co:navigation>
        </f:if>
    </f:section>
</html>
