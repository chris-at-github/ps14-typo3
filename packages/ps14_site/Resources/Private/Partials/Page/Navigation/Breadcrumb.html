<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
    <f:section name="Main">
        <f:if condition="{data.tx_foundation_disable_breadcrumb} == 0">
            <f:spaceless>
                <nav id="breadcrumb" class="container container-outer breadcrumb" aria-label="{f:translate(key: 'navigation.label.breadcrumb', domain: 'ps14_foundation.frontend')}">
                    <div class="container-inner"><f:cObject typoscriptObjectPath="navigation.breadcrumb" /></div>
                </nav>
            </f:spaceless>
        </f:if>
    </f:section>
</html>
