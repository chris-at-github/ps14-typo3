<div xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
    <f:section name="Main">
        <div id="a--{identifier}-container" class="collapse {f:if(condition: '{expanded}', then: 'show')}" aria-hidden="{f:if(condition: '{expanded}', then: 'false', else: 'true')}" aria-labelledby="a--{identifier}-header">
            <div class="accordion--container accordion--container-{f:if(condition: '{item.recordType} == \'text\'', then: 'default', else: 'record')}">
                <f:if condition="{item.recordType} == 'text'">
                    <f:then><f:render section="Default" arguments="{_all}" /></f:then>
                    <f:else><f:render section="Records" arguments="{_all}" /></f:else>
                </f:if>
            </div>
        </div>
    </f:section>

    <f:section name="Default">
        <div class="ce-bodytext">
            <f:format.html>{item.description}</f:format.html>
        </div>
    </f:section>

    <f:section name="Records">
        <f:for each="{item.content}" as="child">
            <f:cObject typoscriptObjectPath="tt_content" data="{child}" table="tt_content" />
        </f:for>
    </f:section>
</div>
