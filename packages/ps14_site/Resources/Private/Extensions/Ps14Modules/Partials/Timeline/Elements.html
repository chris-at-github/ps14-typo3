<div xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
    <f:section name="Main">
        <div class="ce-history__indicator"></div>
        <ul class="ce-history__container">
            <f:for each="{items}" as="item">
                <f:render section="Item" arguments="{data: data, item: item, settings: settings}" />
            </f:for>
        </ul>
    </f:section>

    <f:section name="Item">
        <li class="ce-history-item">
            <div class="ce-history-item__date">{item.date}</div>
            <div class="ce-history-item__content">
                <f:if condition="{item.title}">
                    <header class="ce-history-item__title">
                        <f:render partial="Header/Header" arguments="{header: item.title, layout: data.tx_foundation_elements_header}" />
                    </header>
                </f:if>

                <f:if condition="{item.description}">
                    <f:format.html>{item.description}</f:format.html>
                </f:if>

                <f:if condition="{item.media}">
                    <ul class="ce-history-item__media">
                        <f:for each="{item.media}" as="media">
                            <f:render section="Media" arguments="{media: media, settings: settings.media}" />
                        </f:for>
                    </ul>
                </f:if>
            </div>
        </li>
    </f:section>

    <f:section name="Media">
        <li class="ce-history-item__media-item">
            <f:render partial="Media/Rendering/Picture" arguments="{
                file: media,
                sizes: settings.mediaQueries,
                settings: settings
            }" />
        </li>
    </f:section>
</div>
