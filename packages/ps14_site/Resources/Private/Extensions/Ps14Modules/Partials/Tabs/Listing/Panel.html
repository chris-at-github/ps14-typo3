<div xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
    <f:section name="Main">
        <div class="tab--pane fade {f:if(condition: item.active, then: 'show active')}" id="tab-panel--{item.uid}" role="tabpanel" aria-labelledby="tab--{item.uid}">
            <f:if condition="{item.recordType} == 'text'">
                <f:then>
                    <div class="ce-bodytext">
                        <f:format.html>{item.description}</f:format.html>
                    </div>
                </f:then>
                <f:else>
                    <f:for each="{item.content}" as="child">
                        <f:cObject typoscriptObjectPath="tt_content" data="{child}" table="tt_content" />
                    </f:for>
                </f:else>
            </f:if>
        </div>
    </f:section>
</div>
