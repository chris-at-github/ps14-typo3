<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="Main">
    <f:comment>Aufteilung (flexform.ratio, z. B. "33-66") auf das 12er-Raster des KIST-Grids</f:comment>
    <f:variable name="gridColumns" value="{25: 3, 33: 4, 50: 6, 66: 8, 75: 9}" />
    <f:variable name="widths" value="{flexform.ratio -> f:split(separator: '-')}" />

    <div class="row">
        <f:render section="Column" arguments="{children: columnOne, width: '{gridColumns.{widths.0}}'}" />
        <f:render section="Column" arguments="{children: columnTwo, width: '{gridColumns.{widths.1}}'}" />
    </div>
</f:section>

<f:section name="Column">
    <f:if condition="{children}">
        <div class="col-12 col-md-{width}">
            <f:for each="{children}" as="child">
                <f:cObject typoscriptObjectPath="tt_content" data="{child}" table="tt_content" />
            </f:for>
        </div>
    </f:if>
</f:section>
</html>
